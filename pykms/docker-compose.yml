services:
  pykms:
    container_name: pykms
    image: ghcr.io/py-kms-organization/py-kms:latest@sha256:d6e0989ae210c203c8e0d56638344219a5e5f27d088e816b910b6fdde935dd8c
    restart: unless-stopped
    ports:
      - "1688:1688"
    environment:
      IP: "0.0.0.0"
      SQLITE: "true"
      HWID: "RANDOM"
      LOGLEVEL: "INFO"
    volumes:
      - "/data/pykms/db:/home/py-kms/db"
      - /etc/localtime:/etc/localtime:ro

